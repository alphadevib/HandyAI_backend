# Production. Activate with SPRING_PROFILES_ACTIVE=prod on the server.
# Every secret comes from the environment; a missing one stops the app at startup instead of
# silently falling back to a development value.

# Hosts such as Render and Railway tell the app which port to listen on.
server.port=${PORT:8080}
# The host's proxy terminates HTTPS; trust its X-Forwarded-* headers for scheme and client address.
server.forward-headers-strategy=framework

# A persistent database: the in-memory H2 default would lose every account on each restart.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB:handyai}?sslMode=${MYSQL_SSL_MODE:REQUIRED}&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# No default: the app refuses to start without a real signing key (32+ characters).
handyai.jwt.secret=${HANDYAI_JWT_SECRET}

# The admin password must be provided as HANDYAI_ADMIN_PASSWORD.
handyai.admin.password=${HANDYAI_ADMIN_PASSWORD}

# Your Vercel domain(s), comma separated, e.g. https://handyai.vercel.app
handyai.cors.allowed-origins=${HANDYAI_CORS_ALLOWED_ORIGINS}

# No demo account with a published password on a live site.
handyai.seed.demo-user=false

# Errors never include stack traces or exception messages in responses.
server.error.include-stacktrace=never
server.error.include-message=never

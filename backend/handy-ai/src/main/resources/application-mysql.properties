# Activate with: mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Create the schema first:  CREATE DATABASE handyai CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:handyai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# InnoDB resolves a deadlock by rolling one transaction back; a short lock wait keeps that fast.
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

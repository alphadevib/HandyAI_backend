spring.application.name=HandyAI
server.port=8080

# --- Database -------------------------------------------------------------------------------
# Default profile runs on an in-memory H2 database so the API starts with zero setup.
# Switch to MySQL with:  --spring.profiles.active=mysql   (see application-mysql.properties)
spring.datasource.url=jdbc:h2:mem:handyai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# No H2 web console: Spring Boot 4 moved it to a separate module, which this app does not include.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Closing the session at the end of the service call: no lazy loading during rendering, so a
# request can never hold a pooled connection while Jackson writes the response.
spring.jpa.open-in-view=false

# Pool sized above the Tomcat concurrency the app actually needs, with a fail-fast timeout so a
# starved pool surfaces as a clear error instead of a hung request.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=HandyAIPool

# --- Transactions ---------------------------------------------------------------------------
# A write that cannot get its lock quickly gives up instead of queueing behind another request.
spring.transaction.default-timeout=15

# --- Security -------------------------------------------------------------------------------
# Override in production, e.g. HANDYAI_JWT_SECRET as an environment variable.
handyai.jwt.secret=${HANDYAI_JWT_SECRET:change-me-handyai-development-secret-key-32+}
handyai.jwt.ttl-minutes=720

# --- Admin ----------------------------------------------------------------------------------
# The one and only admin account. The password is never committed: set HANDYAI_ADMIN_PASSWORD
# in production, or handyai.admin.password in config/application.properties (git-ignored) when
# running locally. With no password configured, no admin account is created.
handyai.admin.email=${HANDYAI_ADMIN_EMAIL:syedibrahimahmed.dev@gmail.com}
handyai.admin.password=${HANDYAI_ADMIN_PASSWORD:}

# --- Frontend -------------------------------------------------------------------------------
# Comma separated. In production set HANDYAI_CORS_ALLOWED_ORIGINS to the Vercel domain(s).
handyai.cors.allowed-origins=${HANDYAI_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

# --- Seed data ------------------------------------------------------------------------------
handyai.seed.demo-user=true

# --- JSON -----------------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
# Jackson 3 (Spring Boot 4) already writes java.time values as ISO-8601 strings.

spring.application.name=HandyAI
server.port=8080

# --- Database -------------------------------------------------------------------------------
# Default profile runs on an in-memory H2 database so the API starts with zero setup.
# Switch to MySQL with:  --spring.profiles.active=mysql   (see application-mysql.properties)
spring.datasource.url=jdbc:h2:mem:handyai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# No H2 web console: Spring Boot 4 moved it to a separate module, which this app does not include.

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
# An existing database without migration history is baselined at V1 (the schema as it was).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Closing the session at the end of the service call: no lazy loading during rendering, so a
# request can never hold a pooled connection while Jackson writes the response.
spring.jpa.open-in-view=false

# Pool sized above the Tomcat concurrency the app actually needs, with a fail-fast timeout so a
# starved pool surfaces as a clear error instead of a hung request.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=HandyAIPool

# --- Transactions ---------------------------------------------------------------------------
# A write that cannot get its lock quickly gives up instead of queueing behind another request.
spring.transaction.default-timeout=15

# --- Security -------------------------------------------------------------------------------
# Override in production, e.g. HANDYAI_JWT_SECRET as an environment variable.
handyai.jwt.secret=${HANDYAI_JWT_SECRET:change-me-handyai-development-secret-key-32+}
handyai.jwt.ttl-minutes=720

# --- Admin ----------------------------------------------------------------------------------
# The one and only admin account. The password is never committed: set HANDYAI_ADMIN_PASSWORD
# in production, or handyai.admin.password in config/application.properties (git-ignored) when
# running locally. With no password configured, no admin account is created.
handyai.admin.email=${HANDYAI_ADMIN_EMAIL:admin@handyai.local}

# Email confirmation for new sign-ups is on when a Brevo API key is set; MAIL_FROM must be a
# sender verified in Brevo. Links in emails point at FRONTEND_URL.
handyai.mail.brevo-api-key=${BREVO_API_KEY:}
handyai.mail.from-email=${MAIL_FROM:}
handyai.mail.from-name=HandyAI
handyai.frontend-url=${FRONTEND_URL:http://localhost:5173}
handyai.admin.password=${HANDYAI_ADMIN_PASSWORD:}

# --- AI chat (Claude) ----------------------------------------------------------------------
# With HANDYAI_ANTHROPIC_API_KEY set, chat replies are written by Claude from the retrieved tools
# (RAG). Without it the chat keeps its rule-based replies. A project-specific variable rather than
# ANTHROPIC_API_KEY, so a key in a developer's shell is never spent by tests by accident.
handyai.ai.api-key=${HANDYAI_ANTHROPIC_API_KEY:}
handyai.ai.model=${HANDYAI_AI_MODEL:claude-opus-5-5}
# Output cap per reply (thinking included); replies are asked to stay under 120 words.
handyai.ai.max-tokens=4096
handyai.ai.effort=low
# Most tokens of retrieved tool data per prompt, and the estimated spend per UTC day after which
# chat falls back to rule-based replies. Prices are per million tokens, for the estimate.
handyai.ai.context-token-budget=1500
handyai.ai.daily-budget-usd=${HANDYAI_AI_DAILY_BUDGET_USD:2.00}
handyai.ai.input-usd-per-million=4.00
handyai.ai.output-usd-per-million=20.00

# --- Frontend -------------------------------------------------------------------------------
# Comma separated. In production set HANDYAI_CORS_ALLOWED_ORIGINS to the Vercel domain(s).
handyai.cors.allowed-origins=${HANDYAI_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

# --- Seed data ------------------------------------------------------------------------------
handyai.seed.demo-user=true

# --- JSON -----------------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
# Jackson 3 (Spring Boot 4) already writes java.time values as ISO-8601 strings.

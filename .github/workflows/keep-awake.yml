# Render's free plan puts the API to sleep after 15 idle minutes, and waking it takes about two and
# a half minutes, during which visitors see "Cannot reach the server". Calling the health check
# every 10 minutes keeps it awake. GitHub can start scheduled runs a few minutes late, so the
# request retries for long enough to wake the API if it did fall asleep.
name: Keep the API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# GitHub switches off scheduled workflows after 60 days without repository activity; each run
# re-enables this one, which counts as activity for that rule.
permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/health
        run: >
          curl --fail --silent --show-error --max-time 60
          --retry 8 --retry-delay 20 --retry-all-errors
          https://handyai-backend-jy0k.onrender.com/api/health

      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-awake.yml/enable"

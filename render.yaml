# Render Blueprint: New > Blueprint > pick this repo. Builds backend/handy-ai/Dockerfile and runs the
# prod profile. Render only reads this file from the repository root.
services:
  - type: web
    name: handyai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/handy-ai/Dockerfile
    dockerContext: ./backend/handy-ai
    healthCheckPath: /api/health
    # Rebuild only when the API itself changes, not for workflow or README commits.
    buildFilter:
      paths:
        - backend/handy-ai/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: HANDYAI_JWT_SECRET
        generateValue: true
      # The live site plus its Vercel preview deployments.
      - key: HANDYAI_CORS_ALLOWED_ORIGINS
        value: https://ib11.vercel.app,https://ib11-*-neuron27.vercel.app
      - key: HANDYAI_ADMIN_EMAIL
        sync: false
      # Email confirmation for new sign-ups: a Brevo API key and a sender verified in Brevo.
      # Leave BREVO_API_KEY empty and sign-ups work without confirmation, as before.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://ib11.vercel.app
      - key: HANDYAI_ADMIN_PASSWORD
        sync: false
      # Claude-written chat replies; leave empty to keep the rule-based replies.
      - key: HANDYAI_ANTHROPIC_API_KEY
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
